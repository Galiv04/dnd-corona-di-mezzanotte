name: Test di Lumelia

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Controlli statici
        run: node tests/validate.mjs
      - name: Partite simulate headless
        run: node tests/playthrough.mjs
